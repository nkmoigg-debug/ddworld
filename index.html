function financeModal(){open(`<div class="eyebrow">ПАСПОРТ СДЕЛКИ · #001</div><h2>Экономика Nissan Juke</h2><div class="line"><span>Покупка</span><b>${fmt(purchase)}</b></div><div class="line"><span>Мойка</span><b>${state.wash?'3 800 ₽':'Не выполнена'}</b></div><div class="line"><span>Краска</span><b>${state.paint?'500 ₽':'Не выполнена'}</b></div><div class="line"><span>Текущие вложения</span><b>${fmt(purchase+expenses())}</b></div><div class="line"><span>Цена продажи (сценарий)</span><b id="saleValue">${fmt(state.salePrice)}</b></div><input id="priceRange" type="range" min="610000" max="700000" step="1000" value="${state.salePrice}" style="width:100%;accent-color:#57e4d9;margin:18px 0"/><div class="price" id="scenarioProfit">${fmt(profit())}</div><p class="hint">Фактическая сделка: продажа 655 000 ₽, вложения 599 300 ₽, прибыль 55 700 ₽. Ползунок меняет только альтернативный расчёт.</p><button class="primary" id="actual">Вернуть фактическую цену</button><button class="secondary" id="dismiss">Закрыть</button>`);$('priceRange').oninput=e=>{state.salePrice=+e.target.value;$('saleValue').textContent=fmt(state.salePrice);$('scenarioProfit').textContent=fmt(profit());$('profit').textContent=fmt(profit())};$('actual').onclick=()=>{state.salePrice=655000;financeModal();refresh()};$('dismiss').onclick=close}
$('finance').onclick=financeModal;$('history').onclick=historyModal;$('camera').onclick=()=>state.camera=(state.camera+1)%3;$('quality').onclick=()=>{state.quality=!state.quality;renderer.setPixelRatio(Math.min(devicePixelRatio,state.quality?1.7:1));$('quality').textContent=state.quality?'⚙ Графика':'⚙ Эко'};
const keys={};window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.code]=false);
for(const [id,k] of [['gas','gas'],['brake','brake']]){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);state[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>state[k]=false)}
const steer=$('steer'),stick=$('stick');steer.addEventListener('pointerdown',e=>{steer.setPointerCapture(e.pointerId);steerMove(e)});steer.addEventListener('pointermove',e=>{if(steer.hasPointerCapture(e.pointerId))steerMove(e)});function steerMove(e){const r=steer.getBoundingClientRect();const dx=Math.max(-40,Math.min(40,e.clientX-r.left-r.width/2));state.steering=dx/40;stick.style.transform=`translate(${dx}px,0)`}for(const ev of ['pointerup','pointercancel'])steer.addEventListener(ev,()=>{state.steering=0;stick.style.transform='translate(0,0)'});
function action(label,fn){const b=$('action');b.style.display='block';b.textContent=label;b.onclick=fn}
const clock=new THREE.Clock();let elapsed=0;function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;if(!state.modal){const throttle=state.gas||keys.KeyW||keys.ArrowUp;const reverse=state.brake||keys.KeyS||keys.ArrowDown;const turn=state.steering+(keys.KeyA||keys.ArrowLeft?-.9:0)+(keys.KeyD||keys.ArrowRight?.9:0);speed+=(throttle?12:reverse?-16:-speed*2.1)*dt;speed=Math.max(-8,Math.min(19,speed));if(!throttle&&!reverse)speed*=Math.pow(.95,dt*60);heading-=turn*dt*(.5+Math.abs(speed)*.055)*(speed<0?-1:1);px+=Math.sin(heading)*speed*dt;pz-=Math.cos(heading)*speed*dt;px=Math.max(-106,Math.min(106,px));pz=Math.max(-106,Math.min(106,pz));car.position.set(px,0,pz);car.rotation.y=heading;wheels.forEach(w=>w.rotation.x-=speed*dt/.48)}
const offset=state.camera===0?new THREE.Vector3(0,17,25):state.camera===1?new THREE.Vector3(0,7,13):new THREE.Vector3(0,55,22);const rotated=offset.clone().applyAxisAngle(new THREE.Vector3(0,1,0),heading);const desired=car.position.clone().add(rotated);camera.position.lerp(desired,Math.min(1,dt*2.5));camera.lookAt(car.position.x,1.5,car.position.z);if(elapsed-routeTimer>1.5){drawRoute();routeTimer=elapsed}if(!state.modal){if(state.step<=1){if(Math.hypot(px-40,pz-40)<13){state.step=1;refresh();action('🧼 Мойка Люкс · 3 800 ₽',washModal)}else $('action').style.display='none'}else if(state.step===2)action('🎨 Добавить краску · 500 ₽',paintModal);else if(state.step===3)action('📱 Открыть каналы продаж',channelModal);else if(state.step>=4)action('✓ Результат сделки · +55 700 ₽',resultModal)}renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});refresh();tick();if(state.completed)setTimeout(resultModal,550);else if(state.step===0)setTimeout(()=>open(`<div class="eyebrow">WELCOME TO DROPDEALER WORLD</div><h2>REAL DEAL #001</h2><p>Реальная история Nissan Juke. Управляйте 3D-машиной и пройдите путь от дилера до продажи. Для игры используются стилизованные улицы, а не точная географическая карта.</p><div class="line"><span>Цена покупки</span><b>595 000 ₽</b></div><div class="line"><span>Реальная прибыль</span><b>55 700 ₽</b></div><button class="primary" id="dismiss">Начать маршрут</button><p class="hint">Нужен интернет для загрузки движка Three.js из CDN.</p>`),400),setTimeout(()=>{const b=$('dismiss');if(b)b.onclick=close},450);
